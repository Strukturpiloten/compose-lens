schema = 1
id = "boxferry-forgejo-application"
suite = "real-world"
description = "Pins the reviewed native Compose subset used by BoxFerry's Forgejo migration application."
secrets_reviewed = true
files = [
  "scenario.compose.yaml",
  "interpolation.env",
  "provider.compose.yaml",
  "provider-peer.compose.yaml",
  "processing.base.yaml",
  "processing.override.yaml",
  "service.base.env",
  "service.raw.env",
  "expected.generated.yaml",
  "UPSTREAM_LICENSE",
]

[provenance]
source = "external"
url = "https://github.com/Strukturpiloten/boxferry/tree/68e08b9a86bcb9ced34e8d831563e732176275a1/fixtures"
revision = "68e08b9a86bcb9ced34e8d831563e732176275a1"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "BoxFerry files were copied byte-for-byte and renamed; processing.*.yaml and service.*.env are ComposeLens-authored MPL-2.0 test overlays."

[environment]
description = "Tests distinguish explicit interpolation input from caller-authorized service env-file content; no process environment, filesystem discovery, provider, image, or runtime is accessed."

[expectations]
summary = "Independent assertions cover Forgejo and PostgreSQL meaning, env-file precedence, empty and unset values, quoting and dollars, anchors, reset and override merge, profiles, sensitive paths, external boundaries, canonical rendering, and generated parse-back."


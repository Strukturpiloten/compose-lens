name: composelens-conformance
x-authored-extension: retained
services:
  app:
    image: example.invalid/composelens/app:1.2.3@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    x-provider-extension: retained
    environment:
      KEEP: authored
    volumes:
      - ./shared:/srv/shared:z
      - type: bind
        source: ./private
        target: /srv/private
        bind:
          create_host_path: false
          selinux: Z
          future_bind_option: retained


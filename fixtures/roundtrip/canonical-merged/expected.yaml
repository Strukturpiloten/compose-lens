---
name: canonical-demo
x-note: "line\nvalue"
services:
  app:
    image: example/app:1.0
    command:
      - override
      - "--quoted=a:b"
    environment:
      ZERO: "00"
      ENABLED: false
      EMPTY: null
      NEW_VALUE: "line\nvalue"
    ports:
      - target: 80
        published: "8080"
    volumes:
      - ./data:/data:Z
    x-vendor: !vendor
      enabled: true
  debug:
    image: example/debug
    profiles:
      - debug
networks:
  default: {}
volumes:
  data: {}

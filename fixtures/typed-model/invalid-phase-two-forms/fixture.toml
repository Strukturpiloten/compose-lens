schema = 1
id = "invalid-phase-two-forms"
suite = "typed-model"
description = "Protects recoverable Phase 2 diagnostics for invalid alternate forms, incomplete long syntax, and invalid resource definitions."
secrets_reviewed = true
files = ["compose.yaml"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "No interpolation or runtime is used."

[expectations]
summary = "Typed extraction retains partial data and emits stable source-spanned diagnostics for every invalid shape."

[extensions.typed-model]
expected_diagnostics = [
  "compose.model.expected-field-form",
  "compose.port.expected-short-or-long",
  "compose.port.long.missing-target",
  "compose.model.expected-sequence",
  "compose.grant.expected-short-or-long",
  "compose.grant.long.missing-source",
  "compose.resource.expected-mapping-or-null",
  "compose.model.expected-mapping",
]

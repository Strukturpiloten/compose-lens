x-common: &common
  restart: unless-stopped
services:
  app:
    <<: *common
    image: "example/base:${TAG:-latest}"
    command: ["echo", "base"]
    entrypoint: ["/base-entrypoint"]
    healthcheck:
      test: ["CMD", "base-health"]
      interval: 30s
    environment:
      MAP_ONLY: base
      SHARED: base
    labels:
      - list.only=base
      - shared=base
    ports:
      - "127.0.0.1:8080:80/tcp"
      - "9090:90"
    volumes:
      - ./base:/data:z
      - cache:/cache
    devices:
      - /dev/base:/dev/device:rwm
    configs:
      - source: base-config
        target: /config
        mode: 0444
    secrets:
      - app-secret
    cap_add: [NET_ADMIN]
    x-unknown:
      nested: base

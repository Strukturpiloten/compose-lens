name: project-view
services:
  web:
    container_name: project-view-web
    image: example.invalid/web:1
    command: ["serve", "--foreground"]
    user: "1000:1000"
    userns_mode: host
    group_add: [audio]
    working_dir: /app
    read_only: false
    environment:
      BASE_ONLY: base
      SHARED: base
    labels:
      - com.example.base=base
      - com.example.shared=base
      - com.example.empty
    extra_hosts:
      - host.docker.internal=host-gateway
      - ipv6=[::1]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    ports:
      - "8080:80"
    volumes:
      - data:/data
    networks:
      appnet:
        aliases: [web-base]
    restart: unless-stopped
  worker:
    image: example.invalid/worker:1
    profiles: [workers]
volumes:
  data:
    driver: local
networks:
  appnet:
    driver: bridge
configs:
  settings:
    file: ./settings.conf
secrets:
  password:
    environment: APP_PASSWORD

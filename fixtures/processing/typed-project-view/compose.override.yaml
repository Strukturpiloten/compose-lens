services:
  web:
    container_name: project-view-web-override
    image: example.invalid/web:2@sha256:abcdef
    entrypoint: ["/usr/local/bin/php", "-d", "variables_order=EGPCS"]
    init: true
    user: "1001:1002"
    userns_mode: keep-id
    group_add: [video]
    working_dir: /srv/app
    read_only: true
    environment:
      - SHARED=override
      - OVERRIDE_ONLY=added
    labels:
      com.example.shared: override
      com.example.override: added
    extra_hosts:
      - database=192.0.2.10
    healthcheck:
      interval: 10s
      retries: 5
    ports:
      - target: 80
        published: "8080"
        protocol: tcp
    volumes:
      - ./cache:/cache:Z,ro
    networks:
      appnet:
        aliases: [web-override]
  worker:
    init: false
volumes:
  data:
    labels:
      com.strukturpiloten.fixture: project-view

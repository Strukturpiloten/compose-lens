[package]
name = "compose-lens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Loss-aware parsing, processing, validation, and rendering of Compose projects"
documentation = "https://docs.rs/compose-lens"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["compose", "containers", "docker", "podman", "yaml"]
categories = ["config", "parser-implementations"]
include = [
  "/.cargo/**",
  "/.editorconfig",
  "/.github/**",
  "/.markdownlint.json",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/clippy.toml",
  "/conformance/**",
  "/deny.toml",
  "/docs/**",
  "/fixtures/**",
  "/rust-toolchain.toml",
  "/rustfmt.toml",
  "/schema/**",
  "/src/**",
  "/tests/**",
]
publish = ["crates-io"]

[package.metadata.strukturpiloten]
company = "Strukturpiloten OHG"
github = "https://github.com/TheRealBecks"
maintainer = 'Martin "Becks" Beckert'
website = "https://www.strukturpiloten.de/"

[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85.0"
homepage = "https://www.strukturpiloten.de/"
repository = "https://github.com/Strukturpiloten/compose-lens"
license = "MPL-2.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[dependencies]
yaml-edit = { version = "=0.2.3", default-features = false }

[dev-dependencies]
serde_json = "1.0.149"
sha2 = { version = "0.10.9", default-features = false }
toml = "1.1.4"

[lints]
workspace = true

[package]
name = "compose-lens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Loss-aware parsing, processing, validation, and rendering of Compose projects"
authors = ['Martin "Becks" Beckert (TheRealBecks)']
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/compose-lens"
license.workspace = true
readme = "README.md"
keywords = ["compose", "containers", "docker", "podman", "yaml"]
categories = ["config", "parser-implementations"]
publish = ["crates-io"]
include = [
    "/.cargo/**",
    "/.github/**",
    "/src/**",
    "/tests/**",
    "/fixtures/**",
    "/conformance/**",
    "/docs/**",
    "/.editorconfig",
    "/.markdownlint.json",
    "/AGENTS.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/clippy.toml",
    "/deny.toml",
    "/rust-toolchain.toml",
    "/rustfmt.toml",
]

[package.metadata.strukturpiloten]
company = "Strukturpiloten OHG"
website = "https://www.strukturpiloten.de/"

[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
homepage = "https://www.strukturpiloten.de/"
repository = "https://github.com/Strukturpiloten/compose-lens"
license = "MPL-2.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[dependencies]
yaml-edit = { version = "=0.2.3", default-features = false }

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }
toml = "=1.1.4"

[lints]
workspace = true

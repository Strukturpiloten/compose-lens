---
name: Provider configuration conformance

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact immutable commit being validated.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact immutable commit to validate (defaults to this dispatch commit).
        required: false
        type: string
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: provider-config-${{ github.workflow }}-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  observed-provider-config:
    name: Observed provider config (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      # The same matrix value selects the runner and records its provenance.
      COMPOSE_LENS_CONFORMANCE_RUNNER_LABEL: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # renovate: datasource=github-runners
        runner:
          - ubuntu-24.04
        target:
          - docker-compose-2-24-3
          - docker-compose-2-24-4
          - docker-compose-2-40-3
          - docker-compose-5-3-1
          - podman-compose-1-3-0
          - podman-compose-1-5-0
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Select reviewed Python bootstrap runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Renovate owns this runner bootstrap pin; the runner verifies it against
          # each podman-compose target's independently reviewed matrix declaration.
          # renovate: datasource=python-version depName=python
          python-version: 3.13.14
      - name: Verify exact candidate identity
        id: candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${CANDIDATE_SHA}"
          printf 'sha=%s\n' "${actual}" >> "${GITHUB_OUTPUT}"
      - name: Run only reviewed provider configuration rows
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/provider-config-${{ github.run_id }}-${{ matrix.target }}
          RUN_ID: ${{ github.run_id }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIRECTORY}"
          printf '{"candidate_sha":"%s","run_id":"%s","task":"%s"}\n' \
            "${CANDIDATE_SHA}" "${RUN_ID}" "${TARGET}" \
            > "${EVIDENCE_DIRECTORY}/identity.json"
          bash scripts/run-observed-provider-config.sh "${TARGET}" \
            "${EVIDENCE_DIRECTORY}/captures"
      - name: Retain current-run native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-config-${{ github.run_id }}-${{ matrix.target }}
          path: ${{ runner.temp }}/provider-config-${{ github.run_id }}-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14

---
name: Qualify Dev Container feature updates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    if: >-
      github.repository == 'Strukturpiloten/compose-lens' &&
      github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' &&
      github.event_name == 'workflow_dispatch'
    uses: Strukturpiloten/boxferry/.github/workflows/shared-devcontainer-updates.yml@48b7e97fc5e1021969a94f73b21dfc6b6c523cd5 # automation-v1 interface v1
    with:
      automation-sha: 48b7e97fc5e1021969a94f73b21dfc6b6c523cd5
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

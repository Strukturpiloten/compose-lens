---
name: Qualify Dev Container feature updates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    if: >-
      github.repository == 'Strukturpiloten/compose-lens' &&
      github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' &&
      github.event_name == 'workflow_dispatch'
    uses: Strukturpiloten/boxferry/.github/workflows/shared-devcontainer-updates.yml@da716b7df2706b7cf4b677bdcbec9ff12ebfd8e7 # automation-v1 interface v1
    with:
      automation-sha: da716b7df2706b7cf4b677bdcbec9ff12ebfd8e7
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
